# Dependency updates for a public repo with ten SDK toolchains.
#
# Monthly and grouped: ungrouped weekly updates across this many ecosystems
# produce more pull requests than anyone reads, and a review queue nobody reads
# is how a malicious update gets waved through. Security advisories ignore this
# schedule entirely — Dependabot opens those immediately for any CVE.
#
# MAJORS ARE ALWAYS THEIR OWN GROUP. Folded in with routine updates, one
# breaking major blocks every unrelated patch in the same PR and hides which
# change caused the failure. `dependency-type` splits are declared only for npm
# and pip, the ecosystems that distinguish production from development; the
# others get minor+patch and major.
#
# ⚠️ Dependabot must never touch a `version` field: on main, a version bump
# PUBLISHES an immutable registry release. Nothing here asks it to — do not add
# a `versioning-strategy` that would.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    # NO `day:` — Dependabot accepts it only for `interval: weekly`, and only
    # as a weekday name. `day: "first"` fails schema validation and takes every
    # entry in this file down with it: no PRs at all, silently. A monthly
    # interval already runs on the first of the month.
    schedule: &monthly
      interval: monthly
      time: "07:00"
      timezone: "UTC"
    commit-message: { prefix: ci }
    groups:
      actions-minor-patch: { update-types: [minor, patch] }
      actions-major:       { update-types: [major] }

  - package-ecosystem: npm
    directory: /sdks/js
    schedule: *monthly
    commit-message: { prefix: deps(js) }
    groups:
      js-prod:  { dependency-type: production,  update-types: [minor, patch] }
      js-dev:   { dependency-type: development, update-types: [minor, patch] }
      js-major: { update-types: [major] }

  - package-ecosystem: pip
    directory: /sdks/python
    schedule: *monthly
    commit-message: { prefix: deps(py) }
    groups:
      py-prod:  { dependency-type: production,  update-types: [minor, patch] }
      py-dev:   { dependency-type: development, update-types: [minor, patch] }
      py-major: { update-types: [major] }

  - package-ecosystem: cargo
    directory: /sdks/rust
    schedule: *monthly
    commit-message: { prefix: deps(rust) }
    groups:
      rust-minor-patch: { update-types: [minor, patch] }
      rust-major:       { update-types: [major] }

  - package-ecosystem: maven
    directory: /sdks/java
    schedule: *monthly
    commit-message: { prefix: deps(java) }
    groups:
      java-minor-patch: { update-types: [minor, patch] }
      java-major:       { update-types: [major] }

  - package-ecosystem: gradle
    directory: /sdks/kotlin
    schedule: *monthly
    commit-message: { prefix: deps(kotlin) }
    groups:
      kotlin-minor-patch: { update-types: [minor, patch] }
      kotlin-major:       { update-types: [major] }

  - package-ecosystem: gradle
    directory: /sdks/android
    schedule: *monthly
    commit-message: { prefix: deps(android) }
    groups:
      android-minor-patch: { update-types: [minor, patch] }
      android-major:       { update-types: [major] }

  - package-ecosystem: pub
    directory: /sdks/dart
    schedule: *monthly
    commit-message: { prefix: deps(dart) }
    groups:
      dart-minor-patch: { update-types: [minor, patch] }
      dart-major:       { update-types: [major] }

  - package-ecosystem: gomod
    directory: /sdks/go
    schedule: *monthly
    commit-message: { prefix: deps(go) }
    groups:
      go-minor-patch: { update-types: [minor, patch] }
      go-major:       { update-types: [major] }
