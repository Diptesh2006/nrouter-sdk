# Unified multi-language CI workflow for nRouter SDKs.
# Runs on every pull request and on main push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  conformance-and-guards:
    name: Conformance & Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'

      - name: Install Python dependencies for contract testing
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e "sdks/python[dev]"

      - name: Static catalog-count guard
        run: bash tests/sdk-static-catalog-count.test.sh

      - name: Cross-SDK conformance gate self-test
        run: python3 conformance/check_conformance.py --self-test

      - name: Cross-SDK conformance gate
        run: python3 conformance/check_conformance.py

      - name: SDK contract tests
        run: python3 -m pytest tests/test_sdk_contract.py

      - name: Install pinned security scanners
        run: |
          python3 -m pip install pip-audit==2.10.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1

      - name: Dependency security audit
        run: bash scripts/security-audit.sh

  typescript-js:
    name: TypeScript & JavaScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdks/js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Build TypeScript bundle & types
        run: npm run build

  python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mypy type checker
        run: mypy nroutersdk

      - name: Run ruff linter
        run: ruff check nroutersdk

      - name: Run pytest suite
        run: python -m pytest

  java:
    name: Java SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven test suite
        run: mvn -B clean test

  swift:
    name: Swift SDK
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test root Package.swift
        run: swift test

      - name: Test sdks/swift Package.swift
        working-directory: sdks/swift
        run: swift test

  kotlin:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Gradle tests
        run: ./gradlew test --stacktrace
