name: Curl Health Checks

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Gateway Base URL'
        required: false
        default: 'https://api.nrouter.ai/v1'
        type: string
      probe_model:
        description: 'Model to probe for live inference check'
        required: false
        default: 'openai/gpt-4o-mini'
        type: string
      guardrail_model:
        description: 'Model for guardrail checks'
        required: false
        default: 'claude-haiku-4-5-20251001'
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/curl_health_checks/**'
      - '.github/workflows/curl-health-checks.yml'
  pull_request:
    paths:
      - 'scripts/curl_health_checks/**'
      - '.github/workflows/curl-health-checks.yml'

permissions:
  contents: read

concurrency:
  group: curl-health-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-curl:
    name: Model & Provider Curl Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_API_KEY }}
      NROUTER_BASE_URL: ${{ inputs.base_url || 'https://api.nrouter.ai/v1' }}
      PROBE_MODEL: ${{ inputs.probe_model || 'openai/gpt-4o-mini' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run offline self-test
        run: python3 scripts/curl_health_checks/model_curl.py --self-test

      - name: Run Model & Provider Health Check
        if: env.NROUTER_API_KEY != ''
        run: |
          bash scripts/curl_health_checks/model_curl.sh \
            --base-url "${{ env.NROUTER_BASE_URL }}" \
            --probe-model "${{ env.PROBE_MODEL }}" \
            --step-summary

  guardrail-curl:
    name: Guardrails Pure-Curl Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NROUTER_API_KEY: ${{ secrets.NROUTER_API_KEY }}
      NROUTER_BASE_URL: ${{ inputs.base_url || 'https://api.nrouter.ai/v1' }}
      GUARDRAIL_MODEL: ${{ inputs.guardrail_model || 'claude-haiku-4-5-20251001' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run offline self-test
        run: python3 scripts/curl_health_checks/guardrail_curl.py --self-test

      - name: Run Guardrails Health Check
        if: env.NROUTER_API_KEY != ''
        run: |
          bash scripts/curl_health_checks/guardrail_curl.sh \
            --base-url "${{ env.NROUTER_BASE_URL }}" \
            --model "${{ env.GUARDRAIL_MODEL }}" \
            --step-summary
