# Publish ai.nrouter:nrouter-sdk-android to Maven Central, on merge to main.
#
# Requires these repo secrets:
# - CENTRAL_USERNAME: Sonatype Central Portal token username
# - CENTRAL_PASSWORD: Sonatype Central Portal token password
# - GPG_PRIVATE_KEY: ASCII-armored private signing key
# - MAVEN_GPG_PASSPHRASE: passphrase for that private key
name: publish-android

on:
  push:
    branches: [main]
    paths:
      - 'sdks/android/**'
      - 'sdks/kotlin/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-android.yml'
  pull_request:
    paths:
      - 'sdks/android/**'
      - 'sdks/kotlin/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Publish Kotlin core to Maven Local
        working-directory: sdks/kotlin
        run: ./gradlew clean publishToMavenLocal --info

      - name: Run Android tests, lint, and local publish verification
        working-directory: sdks/android
        run: ./gradlew clean build publishToMavenLocal --info

      - name: Run cross-SDK conformance check
        run: |
          python3 -m pip install --upgrade pip
          python3 conformance/check_conformance.py

      - name: Already published?
        id: check
        working-directory: sdks/android
        run: |
          set -euo pipefail
          VERSION="$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          GROUP_ID="$(grep '^group=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          ARTIFACT_ID="nrouter-sdk-android"

          {
            echo "group_id=$GROUP_ID"
            echo "artifact_id=$ARTIFACT_ID"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

          GROUP_PATH="${GROUP_ID//./\/}"
          URL="https://repo1.maven.org/maven2/$GROUP_PATH/$ARTIFACT_ID/$VERSION/$ARTIFACT_ID-$VERSION.pom"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
          case "$code" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"
                 echo "::notice::$GROUP_ID:$ARTIFACT_ID:$VERSION is already on Maven Central; nothing to do." ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::Maven Central answered $code; cannot tell whether $VERSION exists"; exit 1 ;;
          esac

      # Android's published POM points at the Kotlin artifact with this exact
      # version. Both workflows start from the same main push, so fail closed
      # until Central actually serves the core instead of publishing an AAR
      # whose mandatory dependency is temporarily or permanently missing.
      - name: Wait for matching Kotlin core on Maven Central
        if: >-
          github.event_name != 'pull_request'
          && github.ref == 'refs/heads/main'
          && steps.check.outputs.publish == 'true'
        working-directory: sdks/android
        run: |
          set -euo pipefail
          VERSION="$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          KOTLIN_URL="https://repo1.maven.org/maven2/ai/nrouter/nrouter-sdk-kotlin/$VERSION/nrouter-sdk-kotlin-$VERSION.pom"
          for attempt in $(seq 1 360); do
            echo "Checking Kotlin core $VERSION availability ($attempt/360)..."
            code="$(curl -s -o /dev/null -w '%{http_code}' "$KOTLIN_URL")"
            if [ "$code" = 200 ]; then
              echo "Kotlin core $VERSION is available on Maven Central."
              exit 0
            fi
            if [ "$code" != 404 ]; then
              echo "::error::Maven Central answered $code while checking Kotlin core $VERSION"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Kotlin core $VERSION was not available within 30 minutes; refusing to publish Android."
          exit 1

      - name: Publish to Maven Central
        if: >-
          github.event_name != 'pull_request'
          && github.ref == 'refs/heads/main'
          && steps.check.outputs.publish == 'true'
        working-directory: sdks/android
        env:
          SONATYPE_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./gradlew publish
