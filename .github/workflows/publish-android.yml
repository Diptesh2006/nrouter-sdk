# Verify the source-preview nRouter Android SDK (`ai.nrouter:nrouter-sdk-android`).
#
# Support scope does not authorize a registry release for this SDK. This
# workflow deliberately has read-only permissions and no credentialed publish
# path; publication requires a separate owner scope decision.
name: publish-android

on:
  push:
    branches: [main]
    paths:
      - 'sdks/android/**'
      - 'sdks/kotlin/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-android.yml'
  pull_request:
    paths:
      - 'sdks/android/**'
      - 'sdks/kotlin/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Publish Kotlin core to Maven Local
        working-directory: sdks/kotlin
        run: ./gradlew clean publishToMavenLocal --info

      - name: Run Android tests, lint, and local publish verification
        working-directory: sdks/android
        run: ./gradlew clean build publishToMavenLocal --info

      - name: Run cross-SDK conformance check
        run: |
          python3 -m pip install --upgrade pip
          python3 conformance/check_conformance.py
