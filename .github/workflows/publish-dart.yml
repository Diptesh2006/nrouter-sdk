# Verify the source-preview nRouter Dart SDK.
#
# Support scope does not authorize a pub.dev release. This workflow validates
# the package without accepting credentials or attempting publication.
name: publish-dart

on:
  push:
    branches: [main]
    paths:
      - 'sdks/dart/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-dart.yml'
  pull_request:
    paths:
      - 'sdks/dart/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-dart.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run Dart tests
        run: dart test

      - name: Run cross-SDK conformance check
        working-directory: .
        run: |
          python3 -m pip install --upgrade pip
          python3 conformance/check_conformance.py

      - name: Verify source-only publication guard
        run: |
          grep -Fx 'publish_to: none' pubspec.yaml
