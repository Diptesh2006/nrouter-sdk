# Publish ai.nrouter:nrouter-sdk-kotlin to Maven Central, on merge to main.
#
# Requires these repo secrets:
# - CENTRAL_USERNAME: Sonatype Central Portal token username
# - CENTRAL_PASSWORD: Sonatype Central Portal token password
# - GPG_PRIVATE_KEY: ASCII-armored private signing key
# - MAVEN_GPG_PASSPHRASE: passphrase for that private key
name: publish-kotlin

on:
  push:
    branches: [main]
    paths:
      - 'sdks/kotlin/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-kotlin.yml'
  pull_request:
    paths:
      - 'sdks/kotlin/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-kotlin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Run Kotlin tests
        run: ./gradlew clean check publishToMavenLocal --info

      - name: Run cross-SDK conformance check
        working-directory: .
        run: |
          python3 -m pip install --upgrade pip
          python3 conformance/check_conformance.py

      - name: Run Demo E2E Smoke Check
        run: |
          ./gradlew test --tests "ai.nrouter.sdk.ContractTest"

      - name: Already published?
        id: check
        run: |
          set -euo pipefail
          VERSION="$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          GROUP_ID="$(grep '^group=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          ARTIFACT_ID="nrouter-sdk-kotlin"

          {
            echo "group_id=$GROUP_ID"
            echo "artifact_id=$ARTIFACT_ID"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

          GROUP_PATH="${GROUP_ID//./\/}"
          URL="https://repo1.maven.org/maven2/$GROUP_PATH/$ARTIFACT_ID/$VERSION/$ARTIFACT_ID-$VERSION.pom"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
          case "$code" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"
                 echo "::notice::$GROUP_ID:$ARTIFACT_ID:$VERSION is already on Maven Central; nothing to do." ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::Maven Central answered $code; cannot tell whether $VERSION exists"; exit 1 ;;
          esac

      - name: Publish to Maven Central
        if: >-
          github.event_name != 'pull_request'
          && github.ref == 'refs/heads/main'
          && steps.check.outputs.publish == 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./gradlew publish

