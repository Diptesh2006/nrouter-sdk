# Verify the source-preview nRouter Kotlin and Android SDKs.
#
# Support scope does not authorize a registry release for these SDKs. This
# workflow deliberately has read-only permissions and no credentialed publish
# path; publication requires a separate owner scope decision.
name: publish-kotlin

on:
  push:
    branches: [main]
    paths:
      - 'sdks/kotlin/**'
      - 'sdks/android/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-kotlin.yml'
  pull_request:
    paths:
      - 'sdks/kotlin/**'
      - 'sdks/android/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-kotlin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Run Kotlin tests
        run: ./gradlew clean check publishToMavenLocal --info

      - name: Run cross-SDK conformance check
        working-directory: .
        run: |
          python3 -m pip install --upgrade pip
          python3 conformance/check_conformance.py

      - name: Run Demo E2E Smoke Check
        run: |
          ./gradlew test --tests "ai.nrouter.sdk.ContractTest"

      - name: Run Android tests and lint
        working-directory: sdks/android
        run: ./gradlew build
