# Publish ai.nrouter:nrouter-sdk to Maven Central, on merge to main.
#
# ONE workflow for this language: it tests and it stages a Central deployment.
# Maven Central versions are immutable, so a merge that does not bump the
# version becomes a green no-op instead of a failed republish.
#
# Requires these repo secrets:
# - CENTRAL_USERNAME: Sonatype Central Portal token username
# - CENTRAL_PASSWORD: Sonatype Central Portal token password
# - GPG_PRIVATE_KEY: ASCII-armored private signing key
# - MAVEN_GPG_PASSPHRASE: passphrase for that private key
name: maven

on:
  push:
    branches: [main]
    paths:
      - 'sdks/java/**'
      - 'spec/**'
      - 'conformance/**'
      - '.github/workflows/publish-maven.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - run: mvn -B clean verify

      - name: Cross-SDK conformance
        working-directory: .
        run: |
          python3 conformance/check_conformance.py --self-test
          python3 conformance/check_conformance.py

      - name: Already published?
        id: check
        run: |
          set -euo pipefail
          GROUP_ID="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.groupId)"
          ARTIFACT_ID="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)"
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"

          {
            echo "group_id=$GROUP_ID"
            echo "artifact_id=$ARTIFACT_ID"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

          case "$VERSION" in
            *SNAPSHOT*) echo "::error::$VERSION is a snapshot; publish a stable release version"; exit 1 ;;
            *[!0-9.]*|*..*|.*|*.) echo "::error::'$VERSION' is not a stable MAJOR.MINOR.PATCH version"; exit 1 ;;
          esac

          GROUP_PATH="${GROUP_ID//./\/}"
          URL="https://repo1.maven.org/maven2/$GROUP_PATH/$ARTIFACT_ID/$VERSION/$ARTIFACT_ID-$VERSION.pom"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
          case "$code" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"
                 echo "::notice::$GROUP_ID:$ARTIFACT_ID:$VERSION is already on Maven Central; nothing to do." ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::Maven Central answered $code; cannot tell whether $VERSION exists"; exit 1 ;;
          esac

      - name: Publish to Central
        if: steps.check.outputs.publish == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B clean deploy -P release -Dgpg.pinentryMode=loopback

      - name: Verify Central serves it
        if: steps.check.outputs.publish == 'true'
        env:
          GROUP_ID: ${{ steps.check.outputs.group_id }}
          ARTIFACT_ID: ${{ steps.check.outputs.artifact_id }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          GROUP_PATH="${GROUP_ID//./\/}"
          URL="https://repo1.maven.org/maven2/$GROUP_PATH/$ARTIFACT_ID/$VERSION/$ARTIFACT_ID-$VERSION.pom"
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::could not confirm Maven Central is serving $GROUP_ID:$ARTIFACT_ID:$VERSION within 10 minutes. Check Central before retrying; the version may already be taken."
          exit 1
