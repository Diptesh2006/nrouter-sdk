# Publish @nrouter_ai/sdk to npm, on merge to main.
#
# ONE workflow for this language: it tests and it publishes. There is no
# separate CI file to keep in step.
#
# WHY MERGE-TRIGGERED IS SAFE HERE. npm versions are immutable, so "publish on
# every merge" only works if a merge that changes no version is a NO-OP rather
# than a failure. That is the `already published?` step: it compares
# package.json against the registry and skips the publish when they match. The
# release procedure is therefore just:
#
#     bump "version" in sdks/js/package.json  ->  merge  ->  it ships
#
# and a merge without a bump does nothing, quietly and green.
#
# Requires the NPM_TOKEN repo secret, for now. The intended end state is npm
# trusted publishing (OIDC) with NO secret at all; everything on this side is
# ready and the remaining step is a registration only a human with 2FA can
# perform. The Publish step carries the exact fields and the measured proof
# that it is not yet done.
#
# It matters on a clock, not just on principle: the current credential is a
# bypass-2FA granular token, npm withdraws direct publish from those in
# January 2027 (github.blog changelog, 2026-07-31), and this one expires
# 2026-11-26.
name: npm

on:
  push:
    branches: [main]
    paths: &paths
      - 'sdks/js/**'
      - 'spec/**'
      - 'conformance/**'
      - '.github/workflows/publish-npm.yml'
  # ⚠️ DELIBERATE EXCEPTION to the workspace's local-first CI policy
  # (`gh-workflow` skill: "Never add per-commit or per-PR hosted CI ... without
  # explicit operator direction"). Recorded here so the next reader does not
  # delete it as drift, and so the reasoning can be argued with:
  #
  #   - This repository is PUBLIC and takes outside pull requests. A
  #     contributor cannot run the workspace's local gates, and neither can a
  #     maintainer before reading the PR. "Focused local checks" has no one to
  #     run it.
  #   - Without this trigger a PR ran ZERO checks: every gate lived in the
  #     merge-triggered job, so the first execution of a contributor's code was
  #     the run that PUBLISHED it to npm — immutably.
  #   - The policy's stated cost, hosted minutes, is not incurred: GitHub
  #     Actions is free for public repositories on standard runners.
  #
  # It stays advisory. This is NOT wired as a required status check, and it
  # emits no release evidence — tag-only `release-validation` remains the sole
  # authoritative full suite.
  pull_request:
    paths: *paths
  workflow_dispatch:

# Default for the whole file. `id-token: write` is granted to the publish job
# ALONE — see the note above that job.
permissions:
  contents: read

concurrency:
  # Publishes share one global lane so two can never race an upload. Pull
  # requests key on their own ref, so one contributor's PR does not queue
  # behind another's.
  group: npm-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false   # never cancel a run that may be mid-upload

jobs:
  # Runs the untrusted half: `npm ci` executes install scripts and `npm test`
  # executes the dependency tree. This job is deliberately given NO
  # `id-token` permission, so nothing it runs can mint an npm OIDC token.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    defaults:
      run:
        working-directory: sdks/js
    steps:
      # SHA-PINNED, not @vN. A mutable major tag can be retargeted, and these
      # jobs later hold a registry credential and npm's OIDC permission — so a
      # retargeted action would run unreviewed code with publish rights.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # >= 22.18: the test launcher hands `node --test` the .ts files and
          # relies on native type stripping. On Node 20 the run dies on the
          # first `as`, before a single test executes.
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json

      - run: npm ci

      # The tests and the cross-SDK contract gate. Nothing publishes if either
      # is red — which is the whole reason they live in this file.
      - run: npm test

      - name: Cross-SDK conformance
        working-directory: .
        run: |
          python3 conformance/check_conformance.py --self-test
          python3 conformance/check_conformance.py

      - name: Already published?
        id: check
        run: |
          set -euo pipefail
          PKG=@nrouter_ai/sdk

          # The NAME must be the one we expect. `npm publish` uses whatever
          # package.json says, while the availability check below asks about a
          # fixed name — so a mistyped or changed name would have this step
          # inspect one package and then permanently upload a different one,
          # which a namespace-wide token is happy to do.
          name="$(node -p "require('./package.json').name")"
          if [ "$name" != "$PKG" ]; then
            echo "::error::package.json declares '$name'; this workflow only publishes $PKG"; exit 1
          fi

          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # STABLE SemVer only. An untagged publish moves npm's default
          # `latest` pointer, so a prerelease would make `npm install` hand
          # everyone an rc. Backports go out by hand with --tag.
          case "$v" in
            *[!0-9.]*|*..*|.*|*.) echo "::error::'$v' is not a stable MAJOR.MINOR.PATCH version"; exit 1 ;;
          esac

          if npm view "$PKG@$v" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG@$v is already on npm — nothing to do. Bump the version to release."
            exit 0
          fi

          # AND NEWER THAN LATEST. "Unused" is not "newer": publishing an
          # unused 1.1.0 while 1.2.0 is live moves `latest` BACKWARDS and
          # silently downgrades every fresh install. Nothing errors; consumers
          # just lose features.
          #
          # `|| true` is deliberately NOT used on this lookup — a transient
          # registry failure reading as "nothing published yet" is exactly how
          # a downgrade would slip through.
          if latest="$(npm view "$PKG" version 2>/tmp/e)"; then
            newest="$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -1)"
            if [ "$newest" != "$v" ]; then
              echo "::error::$v is older than the published latest ($latest); publishing it would downgrade every fresh install"
              exit 1
            fi
          elif grep -qiE '404|E404|not found' /tmp/e; then
            echo "::notice::$PKG has no published version yet; $v will be the first"
          else
            echo "::error::could not read the published version from npm, so a downgrade cannot be ruled out:"
            cat /tmp/e >&2; exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # The build output is the ONLY thing that crosses into the publish job.
      # package.json, README and LICENSE come from that job's own clean
      # checkout, so a compromised dependency cannot rewrite the manifest,
      # rename the package, or widen `files` on the way through.
      - name: Hand the built package to the publish job
        if: steps.check.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-dist
          path: sdks/js/dist
          if-no-files-found: error
          retention-days: 1

  # THE ONLY JOB THAT MAY MINT AN OIDC TOKEN, and it runs no repository
  # dependency to do it: no `npm ci`, no `npm test`, no build. It restores the
  # verified `dist/` and packs it.
  #
  # This split is the point of the whole file. `id-token: write` at workflow
  # scope would have handed npm-audience token minting to every process
  # `npm ci` and `npm test` start — a poisoned dependency or cache could then
  # exchange one for publish rights and ship an arbitrary version, with no
  # NODE_AUTH_TOKEN anywhere to steal. Scoping the permission to a job that
  # executes only npm itself is what makes removing the token an improvement
  # rather than a lateral move.
  publish:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing + provenance
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache:` here. A restored npm cache is attacker-controlled content
      # entering the one job that holds the OIDC permission; this job installs
      # no dependencies, so it has nothing to cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing landed in npm 11.5.0 (npm/cli#8336). The
      # runner's bundled npm 10 does not attempt it at all — it would fall
      # through to token auth and, with no token present, simply fail. This is
      # a floor, not an upgrade.
      - name: npm >= 11.5.1, the floor for OIDC trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Restore the verified build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-dist
          path: sdks/js/dist

      # NO CREDENTIAL. `id-token: write` above lets the runner mint a
      # short-lived token that npm exchanges for publish rights, having matched
      # this repository AND this workflow filename against the trusted
      # publisher registered on the package.
      #
      # Deleting NODE_AUTH_TOKEN is load-bearing, not tidying. A token left in
      # place is a working fallback that npm prefers silently — the run would
      # go green without ever proving OIDC works, and the January 2027 removal
      # of bypass-2FA publishing would land as a surprise outage. The proof
      # this path ran is the provenance attestation on the published version
      # naming this workflow.
      # 🛑 STILL THE TOKEN PATH — trusted publishing is NOT yet registered.
      # MEASURED, run 33205627773 (2026-08-28): with this env removed, npm
      # signed a provenance statement and then failed
      #
      #     npm error code E404
      #     404 Not Found - PUT https://registry.npmjs.org/@nrouter_ai%2fsdk
      #     '@nrouter_ai/sdk@1.1.2' could not be found or you do not have
      #     permission to access it
      #
      # which is npm's UNAUTHENTICATED response wearing a 404 — no credential
      # was presented, because no trusted publisher matched. Read it as "the
      # package is missing" and you will go looking in the wrong place; it is
      # published and it is public.
      #
      # THE ONE REMAINING STEP IS A HUMAN AT npmjs.com, because editing
      # trusted-publishing configuration is itself on npm's interactive-2FA
      # list: @nrouter_ai/sdk > Settings > Trusted Publisher > GitHub Actions,
      # organization `nRouterAI`, repository `nrouter-sdk`, workflow filename
      # `publish-npm.yml`, environment EMPTY (this job declares none, and a
      # name here would never match).
      #
      # Then DELETE these two lines and `gh secret delete NPM_TOKEN`. Both
      # halves: a token left beside OIDC is a fallback npm prefers silently, so
      # the run goes green without proving OIDC works — and bypass-2FA tokens
      # lose direct publish in January 2027.
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the registry serves it
        env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          # `npm publish` exiting 0 is npm ACCEPTING the upload; this is the
          # registry SERVING it. Different events, seconds apart.
          # 5 minutes, same reason as the PyPI pipeline: a registry can lag a
          # fresh upload by more than a minute, and a short window turns a good
          # release into a red run.
          for _ in $(seq 1 30); do
            [ "$(npm view '@nrouter_ai/sdk' version)" = "$V" ] && exit 0
            sleep 10
          done
          # The upload already succeeded; this is a confirmation timeout, not a
          # failed publish. Republishing cannot work — the version is taken.
          echo "::error::could not confirm npm is serving $V within 5 minutes. The upload SUCCEEDED; check https://www.npmjs.com/package/@nrouter_ai/sdk rather than republishing."
          exit 1
