# Publish nrouter-sdk to PyPI, on merge to main.
#
# ONE workflow for this language, same shape as publish-npm.yml: it tests and
# it publishes.
#
# WHY MERGE-TRIGGERED IS SAFE HERE. PyPI versions are immutable, so a merge
# that changes no version must be a NO-OP rather than a failure. The
# `already published?` step compares pyproject.toml against the registry and
# skips the upload when they match. The release procedure is:
#
#     bump "version" in sdks/python/pyproject.toml  ->  merge  ->  it ships
#
# Requires the PYPI_API_TOKEN repo secret, scoped to the `nrouter-sdk` project.
# ⚠️ The token in the local credential store is NOT this one — it is scoped to
# the retired brand's project name and cannot publish here.
name: pypi

on:
  push:
    branches: [main]
    paths:
      - 'sdks/python/**'
      - 'spec/**'
      - 'conformance/**'
      - '.github/workflows/publish-pypi.yml'
  # A pull request runs the tests and the conformance gate and PUBLISHES
  # NOTHING — see IS_RELEASE below. Without this, a PR touching only the Python
  # SDK ran zero checks and its first execution was the run that published it.
  pull_request:
    paths:
      - 'sdks/python/**'
      - 'spec/**'
      - 'conformance/**'
      - '.github/workflows/publish-pypi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false   # never cancel a run that may be mid-upload

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Every credential-bearing step is gated on this, not on the trigger
      # shape alone. `workflow_dispatch` accepts an arbitrary --ref, so a
      # branch dispatch is neither a pull request nor main, and excluding only
      # pull requests would let it publish unreviewed code with the token.
      IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: sdks/python
    steps:
      # SHA-PINNED, not @vN. A mutable major tag can be retargeted, and these
      # jobs later hold a registry credential and npm's OIDC permission — so a
      # retargeted action would run unreviewed code with publish rights.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'   # the floor declared in pyproject.toml

      # INSTALL THE PACKAGE, not just the build tools. The first run failed
      # here: the suite imports httpx (a real runtime dependency) and needs
      # pytest-asyncio for `asyncio_mode = auto`, and a bare `pip install
      # pytest` gives you neither. It passed locally only because this machine
      # had them globally — the runner is clean, which is the point of running
      # there. Installing the package also exercises real dependency
      # resolution, which is closer to what a consumer gets.
      - run: |
          python -m pip install --upgrade pip build twine tomli
          python -m pip install -e ".[dev]"

      # The tests and the cross-SDK contract gate. Nothing publishes if either
      # is red.
      - run: python -m pytest -q

      - name: Cross-SDK conformance
        working-directory: .
        run: |
          python3 conformance/check_conformance.py --self-test
          python3 conformance/check_conformance.py

      - name: Already published?
        id: check
        run: |
          set -euo pipefail
          # `tomli`, not `tomllib`: tomllib is 3.11+ and this job pins 3.10, the
          # floor pyproject declares, so tomllib would raise ModuleNotFoundError
          # on every run. tomli is the same parser under its old name and is
          # installed above.
          v="$(python -c "import tomli;print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # 200 means that exact version exists; 404 means it does not. Any
          # other status means we do not know, and not knowing is not
          # permission to upload.
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nrouter-sdk/$v/json")"
          case "$code" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"
                 echo "::notice::nrouter-sdk $v is already on PyPI — nothing to do. Bump the version to release." ;;
            404) echo "publish=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::PyPI answered $code; cannot tell whether $v exists"; exit 1 ;;
          esac

      - name: Build
        if: env.IS_RELEASE == 'true' && steps.check.outputs.publish == 'true'
        run: |
          python -m build
          python -m twine check dist/*

      - name: Publish
        if: env.IS_RELEASE == 'true' && steps.check.outputs.publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

      - name: Verify the registry serves it
        if: env.IS_RELEASE == 'true' && steps.check.outputs.publish == 'true'
        env:
          V: ${{ steps.check.outputs.version }}
        run: |
          # twine exiting 0 is PyPI accepting the upload; this is PyPI serving
          # it. Different events.
          # 5 minutes, not 1. MEASURED on the 2.1.1 release: twine reported
          # success, this step polled for 60s and failed, and the version was
          # serving shortly after — PyPI's JSON API lags a fresh upload by more
          # than a minute. A too-short window turns a good release into a red
          # pipeline and invites someone to "fix" it by republishing, which
          # cannot work: the version is already taken.
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nrouter-sdk/$V/json")" = "200" ] && exit 0
            sleep 10
          done
          # NOT "the publish failed" — the upload already succeeded above. This
          # is only "we could not confirm it inside the window". Check the
          # registry by hand before doing anything else; do NOT rerun to fix it.
          echo "::error::could not confirm PyPI is serving $V within 5 minutes. The upload SUCCEEDED; verify at https://pypi.org/project/nrouter-sdk/$V/ rather than republishing."
          exit 1
