# Test and build nRouter R Package (`nrouter`), on merge to main.
#
# ONE workflow for R: installs system dependencies, builds package,
# runs R CMD check --as-cran, and validates R-universe / GitHub release readiness.
name: publish-r

on:
  push:
    branches: [main]
    paths:
      - 'sdks/r/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-r.yml'
  pull_request:
    paths:
      - 'sdks/r/**'
      - 'spec/**'
      - 'conformance/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/publish-r.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("curl", "httr", "jsonlite", "testthat", "webfakes", "roxygen2", "rcmdcheck"), repos="https://cloud.r-project.org")'

      - name: Run cross-SDK conformance check
        run: |
          python3 -m pip install --upgrade pip
          python3 conformance/check_conformance.py

      - name: Build and Check R Package
        working-directory: sdks
        run: |
          R CMD build r
          R CMD check nrouter_*.tar.gz --as-cran --no-manual

      - name: Release Template for R-universe & CRAN
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "R package built and checked. Ready for R-universe automated indexing and CRAN submission."
