<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nRouter Video Prompt Generator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0a0a0b;
      color: #f5f5f5;
    }
    body {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    h1 { margin: 0 0 20px; font-size: 1.5rem; }
    #messages {
      min-height: 320px;
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }
    #messages pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 0;
      padding: 14px 16px;
      border: 1px solid #2c2c30;
      border-radius: 8px;
      background: #141416;
      line-height: 1.5;
    }
    #messages pre:first-child { border-left: 3px solid #90fca6; }
    #queryInput {
      box-sizing: border-box;
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 1px solid #45454b;
      border-radius: 6px;
      background: #101012;
      color: inherit;
      font: inherit;
    }
    button {
      margin: 12px 8px 0 0;
      padding: 10px 14px;
      border: 1px solid #45454b;
      border-radius: 6px;
      background: #f5f5f5;
      color: #0a0a0b;
      cursor: pointer;
      font: inherit;
    }
    #resetBtn { background: transparent; color: #f5f5f5; }
    button:disabled { cursor: wait; opacity: .6; }
  </style>
</head>
<body>
  <h1>Video Prompt Generator</h1>
  <div id="messages"></div>
  <input type="text" id="queryInput" placeholder="Describe your video or answer the questions..." />
  <button id="genBtn">Send</button>
  <button id="resetBtn">New chat</button>
  <script>
    const messages = document.getElementById('messages');
    const render = (items) => {
      messages.textContent = '';
      for (const item of items || []) {
        const block = document.createElement('pre');
        block.textContent = `${item.role === 'user' ? 'You' : 'Agent'}: ${item.content}`;
        messages.appendChild(block);
      }
    };
    document.getElementById('genBtn').onclick = async () => {
      const val = document.getElementById('queryInput').value;
      if (!val.trim()) return;
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: val })
      });
      const data = await res.json();
      if (data.messages) render(data.messages);
      else render([{ role: 'assistant', content: data.error || 'Request failed' }]);
      document.getElementById('queryInput').value = '';
    };
    document.getElementById('resetBtn').onclick = async () => {
      const res = await fetch('/api/reset', { method: 'POST' });
      render((await res.json()).messages);
    };
  </script>
</body>
</html>
