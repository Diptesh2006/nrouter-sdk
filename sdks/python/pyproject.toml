[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nrouter-sdk"
version = "2.0.0"
description = "nRouter SDK — one API key for models across six provider clouds. Native OpenAI and Anthropic wire formats, plus embeddings, audio, images and video."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "nRouter", email = "hello@nrouter.ai" },
]
keywords = ["llm", "ai", "nrouter", "gateway", "llm-gateway", "openai", "anthropic", "claude", "bedrock", "vertex-ai", "azure", "qwen", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.66.0"   # Responses namespace: ABSENT in 1.65.5, PRESENT in 1.66.0,
    "httpx>=0.24.1",
]

[project.urls]
Homepage = "https://nrouter.ai"
Documentation = "https://nrouter.ai/docs"
Repository = "https://github.com/nRouterAI/nrouter-sdk"
Issues = "https://github.com/nRouterAI/nrouter-sdk/issues"

# Distribution name is `nrouter-sdk`; the import package stays `nroutersdk`.
# Hatchling cannot infer that from the project name, so name it explicitly —
# without this the wheel build fails to locate any package.
[tool.hatch.build.targets.wheel]
packages = ["nroutersdk"]
