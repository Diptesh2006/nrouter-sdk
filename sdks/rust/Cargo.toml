[package]
name = "nrouter"
version = "2.1.0"
edition = "2021"
rust-version = "1.75"
description = "nRouter SDK — one API key for models across six provider clouds"
license = "MIT"
homepage = "https://nrouter.ai"
repository = "https://github.com/nRouterAI/nrouter-sdk"
documentation = "https://docs.rs/nrouter"
readme = "README.md"
keywords = ["llm", "ai", "openai", "gateway", "anthropic"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
async-openai = "0.25"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
